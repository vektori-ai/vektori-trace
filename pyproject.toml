[project]
name = "vektori-trace"
version = "0.1.0"
description = "Trace in, diagnosis + generated RL env/verifier + validity proof out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "litellm>=1.83.14",
    "pydantic>=2.12.5",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
# Parsing ATIF trajectories uses Harbor's own Pydantic models rather than a
# copy of the spec that could drift. Harbor is what produces those files, so
# anything reading them already has it; it stays optional so `diagnose` on
# pasted traces needs neither Harbor nor Docker.
harbor = ["harbor>=0.20"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "harbor>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: hits a real LLM API; needs OPENAI_API_KEY and costs money",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM105", "SIM117", "RUF001", "RUF002", "RUF003"]

[project.scripts]
vektori-trace = "vektori_trace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vektori_trace*"]
