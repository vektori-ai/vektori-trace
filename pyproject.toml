[project]
name = "vektori-trace"
version = "0.1.0"
description = "Trace in, diagnosis + generated RL env/verifier + validity proof out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "litellm>=1.83.14",
    "pydantic>=2.12.5",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
# Parsing ATIF trajectories uses Harbor's own Pydantic models rather than a
# copy of the spec that could drift. Harbor is what produces those files, so
# anything reading them already has it; it stays optional so `diagnose` on
# pasted traces needs neither Harbor nor Docker.
harbor = ["harbor>=0.20"]
# SFT+LoRA train / arm-runner path. Kept optional so diagnose-only installs
# stay light. vllm is deliberately NOT here — it hard-pins torch and only
# belongs inside the Modal serve image (`serve.py`), never the local venv.
train = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "datasets",
    "modal",
    # 4-bit base weights. Not a tuning knob: measured on Modal, Qwen3-8B LoRA in
    # bf16 peaks at ~20.5GB before the loss head and OOMs a 24GB A10G at both
    # 8192 and 4096 context (docs/vram-probe*.json). 24GB is this project's
    # permanent ceiling, so quantizing the frozen base is what makes training
    # possible at all.
    "bitsandbytes",
]

# Bedrock Custom Model Import teacher (`providers/teacher/bedrock.py`). Optional because
# the Fireworks and self-hosted teachers need no AWS SDK, and boto3 is a large
# dependency for a diagnose-only install.
aws = ["boto3>=1.35"]
# Student on the Fireworks Training API (`providers/student/fireworks.py`). The teacher-side
# `providers/teacher/fireworks.py` needs none of this — it is stdlib HTTP, like `providers/teacher/base.py`.
fireworks = [
    "fireworks-ai[training]",
    "tinker-cookbook==0.4.1",
    "torch",
    "transformers",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "harbor>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: hits a real LLM API; needs OPENAI_API_KEY and costs money",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored DeepSeek encoder — pinned by SHA256 in FINAL-PLAN.md; do not reformat.
extend-exclude = ["vektori_trace/encoding_dsv4.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM105", "SIM117", "RUF001", "RUF002", "RUF003"]

[project.scripts]
vektori-trace = "vektori_trace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vektori_trace*"]
